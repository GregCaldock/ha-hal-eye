# Save as config/custom_sentences/en/hal_gags.yaml
language: "en"
intents:
  HalGagPodBayDoors:
    data:
      - sentences:
          - "[HAL] open the pod bay door[s]"
  HalGagHello:
    data:
      - sentences:
          - "hello HAL"
