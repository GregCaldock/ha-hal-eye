# Drop this card anywhere in a view. It takes no space while hidden and covers
# the whole screen (header + sidebar too) while HAL is active.
# Minimal version: just `template` + `entity`. Everything under `variables` is optional.
# triggers_update is only needed on button-card < 7 (7+ tracks these entities
# automatically); it is harmless to keep.
type: custom:button-card
template: hal_eye_overlay
entity: assist_satellite.YOUR_SATELLITE
variables:
  active_entity: binary_sensor.hal_active          # extras/linger.yaml — eye lingers ~4 s
  speaking_entity: input_boolean.tts_playing       # your own "TTS is playing" flag
  mute_entity: input_boolean.hal_mute              # your own mute toggle
triggers_update:
  - binary_sensor.hal_active
  - input_boolean.tts_playing
  - input_boolean.hal_mute
